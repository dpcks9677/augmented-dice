<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>주사위 프리셋 스튜디오</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #111;
      font-family: 'SUIT Variable', -apple-system, sans-serif;
      color: #fff;
      display: flex;
    }
    #viewer-container {
      flex: 1;
      height: 100vh;
      position: relative;
    }
    .camera-tools {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .camera-tools button { text-align: center; white-space: nowrap; }
    .camera-angle {
      height: 130px;
      writing-mode: vertical-lr;
      direction: rtl;
      accent-color: #ffd700;
    }
    .ui-panel {
      width: 320px;
      height: 100vh;
      background: rgba(20, 20, 20, 0.95);
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      z-index: 10;
    }
    .panel-header {
      padding: 20px;
      border-bottom: 1px solid #333;
    }
    .panel-header h2 {
      margin: 0;
      font-size: 1.2rem;
      color: #ffd700;
    }
    .panel-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .section-title {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .subsection-title {
      font-size: 0.82rem;
      color: #bbb;
      margin: 2px 0 8px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-family: 'SUIT Variable', sans-serif;
      transition: all 0.2s;
      text-align: left;
    }
    button:hover:not(:disabled) {
      background: #555;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-action {
      background: #1a4b8c;
      border-color: #2a6bcc;
    }
    .btn-action:hover:not(:disabled) {
      background: #2a6bcc;
    }
    .btn-success {
      background: #1a6b3c;
      border-color: #2a8c4c;
    }
    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .preset-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #222;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
    }
    .preset-item.selected {
      border-color: #ffd700;
      background: #3a3000;
    }
    .preset-list button.active {
      border-color: #ffd700;
      background: #3a3000;
    }
    #btn-board-toggle[aria-pressed="true"] {
      background: #6b4f00;
      border-color: #ffd700;
    }
    #btn-board-toggle {
      width: 100%;
      margin-bottom: 8px;
    }
    .material-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 8px;
    }
    .material-tab {
      padding: 8px 6px;
      background: transparent;
      border-color: transparent;
      color: #aaa;
      text-align: center;
      font-size: 0.78rem;
    }
    .material-tab[aria-selected="true"] {
      background: #6b4f00;
      border-color: #ffd700;
      color: #fff;
    }
    #coin-simulation-actions {
      flex-direction: row;
      gap: 8px;
    }
    #coin-simulation-actions[hidden] {
      display: none !important;
    }
    #coin-simulation-actions button {
      flex: 1;
      text-align: center;
    }
    .model-choice {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .model-choice button { flex: 1; }
    .model-count {
      width: 54px;
      padding: 8px 4px;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
    }
    .preset-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      margin-right: 8px;
    }
    .preset-item .score {
      flex-shrink: 0;
      font-size: 0.8rem;
      color: #aaa;
    }
    .status-text {
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 10px;
    }
    .footer-actions {
      padding: 20px;
      border-top: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="ui-panel">
    <div class="panel-header">
      <h2>프리셋 스튜디오</h2>
    </div>
    
    <div class="panel-content">
      <div>
        <div class="section-title">0. 모델 뷰어</div>
        <div id="model-list" class="preset-list">
          <div class="status-text">모델 목록 준비 중...</div>
        </div>
        <div id="model-status" class="status-text">모델을 선택하면 보드 위에 표시됨.</div>
      </div>

      <div>
        <div class="section-title">1. 판 시뮬레이션</div>
        <button id="btn-board-toggle" class="btn-action" aria-pressed="false">보드 위에서 보기: 꺼짐</button>
        <div class="btn-group">
          <button id="btn-simulate-dice" class="btn-action">선택 모델 던지기</button>
          <div id="coin-simulation-actions" class="btn-group" hidden>
            <button id="btn-flip-coin" class="btn-success">동전 앞면 던지기</button>
            <button id="btn-flip-coin-tails">동전 뒷면 던지기</button>
          </div>
        </div>
        <div id="simulation-status" class="status-text">대기 중...</div>
      </div>

      <div>
        <div class="section-title">2. 자동 추출 (Bake 100x)</div>
        <div class="subsection-title">프리셋 생성</div>
        <select id="dice-count" style="width: 100%; margin-bottom: 4px; padding: 6px; background: #222; color: white; border: 1px solid #444; border-radius: 4px;">
          <option value="6">전체 주사위 6개</option>
          <option value="5">전체 주사위 5개</option>
          <option value="4">전체 주사위 4개</option>
          <option value="3">전체 주사위 3개</option>
          <option value="2">전체 주사위 2개</option>
          <option value="1">전체 주사위 1개</option>
        </select>
        <select id="octa-count" style="width: 100%; margin-bottom: 8px; padding: 6px; background: #222; color: white; border: 1px solid #444; border-radius: 4px;">
          <option value="0" selected>그 중 8면체 0개</option>
          <option value="2">그 중 8면체 2개</option>
          <option value="1">그 중 8면체 1개</option>
          <option value="3">그 중 8면체 3개</option>
          <option value="4">그 중 8면체 4개</option>
          <option value="5">그 중 8면체 5개</option>
          <option value="6">그 중 8면체 6개</option>
        </select>
        <div class="btn-group">
          <button id="btn-bake-normal">일반 6면체 추출</button>
          <button id="btn-bake-octa">8면체 추출</button>
          <button id="btn-bake-flip">판 뒤집기 추출</button>
        </div>
        <div id="bake-status" class="status-text">대기 중...</div>
        <div class="subsection-title">생성된 프리셋</div>
        <div class="preset-list" id="preset-list">
          <div class="status-text">추출된 프리셋이 없습니다.</div>
        </div>
      </div>

      <div>
        <div class="section-title">3. 저장 프리셋 불러오기</div>
        <div class="subsection-title">저장된 프리셋 불러오기</div>
        <div class="btn-group" style="margin-bottom: 10px;">
          <select id="saved-preset-file" style="width: 100%; padding: 6px; background: #222; color: white; border: 1px solid #444; border-radius: 4px;">
            <option value="">저장 프리셋 불러오는 중...</option>
          </select>
          <button id="btn-load-saved-preset" disabled>저장 프리셋 불러오기</button>
        </div>
        <div class="status-text">불러온 프리셋은 2번 섹션의 생성된 프리셋 목록에 표시됩니다.</div>
      </div>

      <div>
        <div class="section-title">4. 보드 재질 비교</div>
        <div class="subsection-title">코듀로이 바닥</div>
        <div class="material-tabs" role="tablist" aria-label="코듀로이 재질 비교">
          <button id="tab-corduroy-before" class="material-tab" type="button" role="tab" aria-selected="false">적용 전</button>
          <button id="tab-corduroy-after" class="material-tab" type="button" role="tab" aria-selected="true">적용 후</button>
        </div>
        <div class="subsection-title">Soft Plastic 림·벽</div>
        <div class="material-tabs" role="tablist" aria-label="Soft Plastic 재질 비교">
          <button id="tab-plastic-before" class="material-tab" type="button" role="tab" aria-selected="false">적용 전</button>
          <button id="tab-plastic-after" class="material-tab" type="button" role="tab" aria-selected="true">적용 후</button>
        </div>
        <div id="material-compare-status" class="status-text">코듀로이 적용 후 · Soft Plastic 적용 후</div>
      </div>
    </div>

    <div class="footer-actions">
      <div class="btn-group" style="margin-bottom: 12px;">
        <button id="btn-play" class="btn-action" disabled>▶ 선택한 프리셋 재생</button>
        <button id="btn-keep" class="btn-success" disabled>★ 현재 프리셋 확정 (Keep)</button>
      </div>
      <div class="section-title">확정된 팩: <span id="kept-count">0</span>개</div>
      <button id="btn-export" disabled>최종 JSON 팩 다운로드</button>
    </div>
  </div>

  <div id="viewer-container">
    <div class="camera-tools" aria-label="카메라 조절">
      <button id="btn-camera-reset" type="button">카메라 초기화</button>
      <input id="camera-angle" class="camera-angle" type="range" min="0" max="75" step="1" value="35" aria-label="카메라 각도" />
      <output id="camera-angle-value" for="camera-angle">35°</output>
    </div>
  </div>

  <script>
    if (location.protocol === 'file:') {
      document.body.innerHTML = '<main style="margin:auto;max-width:560px;padding:24px;color:#fff;font:16px/1.6 sans-serif"><h1>프리셋 스튜디오는 로컬 서버가 필요함</h1><p>ES 모듈은 file:// 주소에서 실행할 수 없음.</p><pre style="padding:12px;background:#222;border-radius:6px">npm run preset-studio</pre><p>명령 실행 뒤 자동으로 열린 http:// 주소를 사용하면 됨.</p></main>';
    } else {
      const script = document.createElement('script');
      script.type = 'module';
      script.src = '/src/presetStudio.js';
      document.body.append(script);
    }
  </script>
</body>
</html>
